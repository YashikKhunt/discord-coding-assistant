# Egress proxy for sandboxes: only package registries are reachable.
http_port 3128

acl allowed_hosts dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_hosts
http_access deny all

cache deny all
# Default log files under /var/log/squid; the ubuntu/squid entrypoint streams them to docker logs.
logfile_rotate 0
shutdown_lifetime 1 seconds
