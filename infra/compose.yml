name: dca

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dca
      POSTGRES_PASSWORD: dca
      POSTGRES_DB: dca
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dca -d dca"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only way out of the sandbox network. Sandboxes are attached to `sandbox`
  # (internal: no route to the internet) and reach registries through this proxy.
  egress-proxy:
    image: ubuntu/squid:6.13-25.04_beta
    restart: unless-stopped
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowlist.txt:/etc/squid/allowlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3128'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandbox
      - egress

networks:
  sandbox:
    internal: true
  egress: {}

volumes:
  pgdata:
