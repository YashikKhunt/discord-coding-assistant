name: dca

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dca
      POSTGRES_PASSWORD: dca
      POSTGRES_DB: dca
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dca -d dca"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
