name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dca
          POSTGRES_PASSWORD: dca
          POSTGRES_DB: dca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dca -d dca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dca:dca@localhost:5432/dca
      SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build dashboard
        run: pnpm --filter @dca/dashboard build
      - name: Build sandbox images
        run: pnpm sandbox:build
      - run: pnpm test
