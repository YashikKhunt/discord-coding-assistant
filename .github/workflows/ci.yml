name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dca
          POSTGRES_PASSWORD: dca
          POSTGRES_DB: dca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dca -d dca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dca:dca@localhost:5432/dca
      SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build dashboard
        run: pnpm --filter @dca/dashboard build
      - name: Build sandbox images
        run: pnpm sandbox:build
      - run: pnpm test

  deploy:
    # Merges into main arrive as pushes; pull_request runs must never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On the job, not the workflow: at workflow level this would also serialise PR CI.
    # Never cancel in progress — a half-finished deploy is worse than a queued one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Deploy to the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GIT_SHA: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The remote end forces infra/scripts/ci-deploy.sh, which deploys this exact
          # SHA rather than whatever origin/main happens to be a few pushes later.
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GIT_SHA"

      - name: Verify production health
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"ok":true'; then
              echo "$HEALTH_URL reports healthy"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet"
            sleep 10
          done
          echo "$HEALTH_URL never reported healthy after deploy" >&2
          exit 1
